[build-system]
requires = ["flit_core >=3.12.0,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.metadata]
module = "dockerctx"
author = "Caleb Hattingh"
author-email = "caleb.hattingh@gmail.com"
home-page = "https://github.com/cjrh/dockerctx"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
description-file = "README.rst"
requires-python = ">=3.10"
requires = [
    "docker",
    "psycopg2-binary",
]

[tool.flit.metadata.requires-extra]
"dev" = [
    "sqlalchemy",
    "sqlalchemy_utils",
    "sqllogformatter",
    "pytest",
    "redis",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.format]
# Match the existing single-quote convention in dockerctx.py.
quote-style = "single"

[tool.ruff.lint]
# E/F (pyflakes + pycodestyle) and I (import sorting).
select = ["E", "F", "I"]
