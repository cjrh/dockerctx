[build-system]
requires = ["uv_build>=0.11.16,<0.13"]
build-backend = "uv_build"

[project]
name = "dockerctx"
version = "2026.1.1"
description = "A context manager for a docker container."
readme = "README.rst"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Caleb Hattingh", email = "caleb.hattingh@gmail.com" },
]
classifiers = [
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
]
dependencies = [
    "docker",
    "psycopg2-binary",
]

[project.urls]
Homepage = "https://github.com/cjrh/dockerctx"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
test = [
    "pytest",
    "pytest-cov",
    "coverage",
    "redis",
    "sqlalchemy",
    "sqlalchemy_utils",
    "sqllogformatter",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.format]
# Match the existing single-quote convention in dockerctx.
quote-style = "single"

[tool.ruff.lint]
# E/F (pyflakes + pycodestyle) and I (import sorting).
select = ["E", "F", "I"]
